<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Distribution</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 750px;
            text-align: center;
        }

        .pie-chart {
            position: relative;
            width: 650px;
            height: 650px;
            margin: auto;

            border-radius: 50%;

            /*
                Total students = 94

                12 students = 45.96°
                14 students = 53.62°
                42 students = 160.85°
                22 students = 84.26°
                4 students  = 15.32°
            */

            background:
                conic-gradient(
                    from -90deg,

                    #fff0a8 0deg 45.96deg,
                    #fff0a8 45.96deg 99.58deg,
                    #fff0a8 99.58deg 260.43deg,
                    #fff0a8 260.43deg 344.69deg,
                    #fff0a8 344.69deg 360deg
                );

            border: 8px solid #f28c00;

            /* Creates the orange dividing lines */
            overflow: hidden;
        }

        /*
        Orange lines between sections
        */
        .line {
            position: absolute;
            width: 8px;
            height: 50%;
            background: #f28c00;
            left: calc(50% - 4px);
            top: 0;
            transform-origin: bottom center;
            z-index: 2;
        }

        .line-1 {
            transform: rotate(0deg);
        }

        .line-2 {
            transform: rotate(53.62deg);
        }

        .line-3 {
            transform: rotate(107.24deg);
        }

        .line-4 {
            transform: rotate(267.91deg);
        }

        .line-5 {
            transform: rotate(283.23deg);
        }

        /*
        Text inside the chart
        */
        .label {
            position: absolute;
            z-index: 5;
            color: #258c45;
            font-size: 25px;
            font-weight: bold;
            line-height: 1.4;
            white-space: nowrap;
        }

        .students {
            display: block;
            margin-top: 22px;
            color: #2166a5;
            font-size: 21px;
            font-weight: normal;
        }

        /* Top-right */
        .label-1 {
            top: 105px;
            left: 300px;
        }

        /* Right */
        .label-2 {
            top: 250px;
            left: 365px;
        }

        /* Bottom-right */
        .label-3 {
            top: 415px;
            left: 275px;
        }

        /* Bottom-left */
        .label-4 {
            top: 350px;
            left: 45px;
        }

        /* Top-left */
        .label-5 {
            top: 125px;
            left: 60px;
        }

        /*
        Small center point
        */
        .center {
            position: absolute;
            width: 18px;
            height: 18px;
            background: #f28c00;
            border-radius: 50%;
            left: calc(50% - 9px);
            top: calc(50% - 9px);
            z-index: 10;
        }

        @media (max-width: 750px) {
            .container {
                width: 100%;
            }

            .pie-chart {
                width: 90vw;
                height: 90vw;
            }

            .label {
                font-size: 3.2vw;
            }

            .students {
                font-size: 2.7vw;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="pie-chart">

            <!-- Dividing lines -->
            <div class="line line-1"></div>
            <div class="line line-2"></div>
            <div class="line line-3"></div>
            <div class="line line-4"></div>
            <div class="line line-5"></div>

            <!-- Labels -->

            <div class="label label-1">
                &gt;0 &amp; &lt;35
                <span class="students">12 students</span>
            </div>

            <div class="label label-2">
                &gt;35 &amp; &lt;55
                <span class="students">14 students</span>
            </div>

            <div class="label label-3">
                &gt;55 &amp; &lt;75
                <span class="students">42 students</span>
            </div>

            <div class="label label-4">
                &gt;76 &amp; &lt;90
                <span class="students">22 students</span>
            </div>

            <div class="label label-5">
                &gt;91 &amp; &lt;100
                <span class="students">4 students</span>
            </div>

            <div class="center"></div>

        </div>

    </div>

</body>
</html>
