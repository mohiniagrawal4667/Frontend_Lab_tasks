<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlapping Boxes</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .container {
      position: relative;
      width: 800px;
      height: 700px;
      margin: 50px auto;
    }

    .box {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 40px;
      opacity: 0.85;
    }

    .box1 {
      top: 0;
      left: 80px;
      background: #b8d99a;
      border: 8px solid #a56f73;
    }

    .box2 {
      top: 170px;
      left: 250px;
      background: #55b9d5;
      border: 8px solid #b99c54;
    }

    .box3 {
      top: 400px;
      left: 50px;
      background: #8edfc4;
      border: 8px solid #627bd8;
    }

    .box4 {
      top: 370px;
      left: 400px;
      background: #8ee0c4;
      border: 8px solid #4b9e68;
    }

    .box5 {
      top: 570px;
      left: 250px;
      background: #d9d9d9;
      border: 8px solid #555;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
    <div class="box box5"></div>
  </div>

</body>
</html>
