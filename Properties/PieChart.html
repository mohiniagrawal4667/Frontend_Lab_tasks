<style>
       .pie{
            border-radius: 50%;
            background-color:bisque;
            border: 2px solid rgb(161, 64, 101);
            height: 500px;
            width:500px;
        }
        .chart{
            background-image:conic-gradient(rgb(48, 7, 22) 0deg,rgb(51, 51, 79) 45deg,rgb(62, 54, 9) 90deg,rgb(108, 26, 110) 120deg,rgb(54, 33, 12) 160deg,rgb(83, 116, 111) 200deg,rgb(195, 228, 207) 270deg,rgb(95, 99, 105) 300deg,rgb(210, 194, 232) 330deg,rgb(234, 189, 224) 360deg);
        }
    </style>  
<body>
    <div class="pie chart"></div>
